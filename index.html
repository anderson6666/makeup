<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>妆友约 | 化妆互助预约</title>
  <style>
    :root {
      --font: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --bg: #f4f2ed;
      --surface: #ffffff;
      --line: #e7e3da;
      --text: #26221c;
      --muted: #8a8377;
      --brand: #2f6b52;
      --brand-strong: #245544;
      --brand-soft: #eaf3ee;
      --accent: #c08a4a;
      --danger: #b6453c;
      --radius: 14px;
      --shadow: 0 1px 2px rgba(60, 54, 40, .04), 0 8px 28px rgba(60, 54, 40, .06);
      --shadow-lg: 0 4px 8px rgba(60, 54, 40, .06), 0 20px 48px rgba(60, 54, 40, .10);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(1200px 400px at 100% -10%, #e5efe8 0%, transparent 60%),
        radial-gradient(900px 360px at -10% 0%, #fbeee0 0%, transparent 55%),
        var(--bg);
      min-height: 100vh;
    }
    a { color: var(--brand); }
    header {
      position: sticky; top: 0; z-index: 20;
      background: rgba(255, 255, 255, .82);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .topbar, main { width: min(1040px, calc(100% - 32px)); margin: auto; }
    .topbar { min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 800; letter-spacing: .2px; }
    .brand-mark {
      width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
      background: linear-gradient(135deg, var(--brand), var(--brand-strong)); color: #fff; font-size: 18px;
      box-shadow: inset 0 -2px 6px rgba(0,0,0,.18);
    }
    main { padding: 30px 0 70px; }
    h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: .2px; }
    h2 { font-size: 18px; margin: 0 0 16px; }
    p { line-height: 1.65; }
    .muted { color: var(--muted); font-size: 14px; }
    .hero p { margin: 0; }

    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .toolbar { margin: 22px 0; }
    .layout { display: grid; grid-template-columns: 1fr 330px; gap: 28px; align-items: start; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); }
    .section-title { display: flex; align-items: center; gap: 8px; }

    .avatar {
      flex: none; width: 40px; height: 40px; border-radius: 50%; overflow: hidden;
      display: inline-grid; place-items: center; background: var(--brand-soft);
      border: 1px solid #d5e6dc;
    }
    .avatar svg { width: 100%; height: 100%; }

    .post { display: grid; grid-template-columns: auto 1fr; gap: 14px; padding: 18px 0; border-bottom: 1px solid var(--line); }
    .post:last-child { border-bottom: 0; }
    .post-body h3 { font-size: 17px; margin: 0 0 8px; }
    .post-body p { margin: 8px 0; }
    .tag { display: inline-block; color: var(--brand); background: var(--brand-soft); border-radius: 999px; padding: 2px 10px; font-size: 12px; margin-right: 6px; vertical-align: middle; }
    .meta { color: var(--muted); font-size: 13px; }
    .author-line { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .author-name { font-weight: 600; font-size: 13px; color: var(--brand-strong); }

    form { display: grid; gap: 10px; }
    input, textarea, select, button {
      font: inherit; min-height: 42px; border: 1px solid var(--line); border-radius: 10px;
      padding: 9px 12px; background: #fff; color: var(--text);
      transition: border-color .15s, box-shadow .15s, transform .05s;
    }
    textarea { min-height: 110px; resize: vertical; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(47,107,82,.14); }
    button { cursor: pointer; font-weight: 650; border-color: transparent; }
    button:active { transform: translateY(1px); }
    button.primary { color: #fff; background: linear-gradient(135deg, var(--brand), var(--brand-strong)); border-color: transparent; box-shadow: 0 6px 16px rgba(47,107,82,.28); }
    button.primary:hover { filter: brightness(1.05); }
    button.primary:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; }
    button.subtle { background: transparent; color: var(--brand); border-color: var(--line); }
    button.subtle:hover { background: var(--brand-soft); }
    button.ghost { background: transparent; border-color: transparent; color: var(--muted); min-height: 34px; padding: 4px 8px; }
    button.ghost:hover { color: var(--brand-strong); background: var(--brand-soft); }

    .auth { display: flex; gap: 8px; align-items: center; }
    .auth input { width: 170px; background: #fff; }
    .userbox { display: flex; align-items: center; gap: 10px; }
    .notice {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px; background: var(--surface); border: 1px solid var(--line);
      border-left: 4px solid var(--brand); border-radius: 10px; margin: 16px 0;
      box-shadow: var(--shadow);
    }
    .notice.error { border-left-color: var(--danger); }

    .rules {
      background: linear-gradient(180deg, #fbf8f2, #f7f3ea);
      border: 1px dashed #d8c9a8;
    }
    .rules h2 { margin-bottom: 10px; }
    .rules ul { margin: 0; padding-left: 18px; }
    .rules li { font-size: 13px; color: #6a5c3e; line-height: 1.9; }
    .rules .highlight { font-weight: 700; color: var(--brand-strong); }
    .hint { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .hidden { display: none !important; }
    .empty { padding: 16px 0; color: var(--muted); font-size: 14px; }

    .fade-in { animation: fadeIn .3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    /* 微信内置浏览器引导 */
    #wechat-guide {
      display: none;
      position: fixed; inset: 0; z-index: 999;
      background: rgba(38, 34, 28, .62);
      backdrop-filter: blur(2px);
      align-items: center; justify-content: center;
      padding: 20px;
    }
    #wechat-guide.show { display: flex; }
    .wechat-card {
      background: #fff;
      border-radius: 18px;
      padding: 26px 22px;
      max-width: 340px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow-lg);
      animation: fadeIn .25s ease;
    }
    .wechat-card h2 { margin: 0 0 10px; font-size: 19px; }
    .wechat-card p { margin: 0 0 6px; font-size: 14px; line-height: 1.7; color: var(--muted); }
    .wechat-card .btn-row { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
    .wechat-tip {
      font-size: 12px; color: var(--muted); line-height: 1.8;
      margin-top: 12px; padding: 10px 12px;
      background: var(--brand-soft); border-radius: 10px;
    }
    .wechat-tip b { color: var(--brand-strong); }

    @media (max-width: 820px) {
      .layout { display: flex; flex-direction: column; }
      .layout > section { order: 2; }
      .layout > aside { order: 1; }
      .topbar { align-items: flex-start; flex-direction: column; padding: 12px 0; }
      .auth { width: 100%; flex-wrap: wrap; }
      .auth input { flex: 1; min-width: 130px; }
    }
  </style>
</head>
<body>
<!-- 微信内置浏览器引导：检测到 MicroMessenger 时展示 -->
<div id="wechat-guide">
  <div class="wechat-card">
    <h2>请用浏览器打开</h2>
    <p>微信内可能无法正常登录、发布或跳转。</p>
    <div class="btn-row">
      <button class="primary" id="wechatCopy">复制链接到浏览器</button>
      <button class="subtle" id="wechatContinue">仍然在微信中打开</button>
    </div>
    <div class="wechat-tip">
      更推荐的方式：点右上角 <b>···</b> → 选择 <b>「在浏览器打开」</b>，体验更完整。
    </div>
  </div>
</div>
<header>
  <div class="topbar">
    <div class="brand">
      <span class="brand-mark">妆</span>
      <span>妆友约</span>
    </div>

    <div class="auth" id="authControls">
      <input id="email" type="email" placeholder="邮箱" autocomplete="email">
      <input id="password" type="password" placeholder="密码" autocomplete="current-password">
      <button class="primary" id="signIn">登录</button>
      <button class="subtle" id="signUp">注册</button>
    </div>

    <div class="row hidden" id="userControls">
      <div class="userbox">
        <span class="avatar" id="headerAvatar" aria-hidden="true"></span>
        <span id="headerName" class="muted" style="font-size:14px"></span>
        <button class="ghost" id="editNickname" title="修改昵称">改昵称</button>
      </div>
      <button class="subtle" id="signOut">退出</button>
    </div>
  </div>
</header>

<main>
  <div class="hero">
    <h1>找到一起变美的妆友</h1>
    <p class="muted">发布化妆服务或寻找妆友，通过预约申请确认时间。</p>
  </div>
  <div id="message" class="notice hidden" role="status"></div>

  <div class="toolbar card">
    <div class="row">
      <select id="typeFilter" aria-label="帖子类型">
        <option value="">全部帖子</option>
        <option value="offer">提供化妆</option>
        <option value="looking">寻找化妆</option>
      </select>
      <input id="cityFilter" placeholder="按城市筛选">
      <button id="refresh" class="subtle">刷新</button>
      <span class="hint">共 <b id="postCount">0</b> 篇</span>
    </div>
  </div>

  <div class="layout">
    <section>
      <div class="card">
        <h2 class="section-title">最新帖子</h2>
        <div id="posts"><p class="empty">正在加载...</p></div>
        <div id="pagination" class="row hidden" style="justify-content:center;padding-top:16px;border-top:1px solid var(--line);margin-top:6px"></div>
      </div>
    </section>

    <aside>
      <div class="card rules" style="margin-bottom:18px">
        <h2>发布规则</h2>
        <ul>
          <li>游客（未登录）：<span class="highlight">每小时最多发布 1 个帖子</span>。</li>
          <li>登录用户：<span class="highlight">每小时最多发布 3 个帖子</span>，超出后请稍等。</li>
          <li>禁止发布违规内容：<span class="highlight">网址链接、色情低俗、暴力威胁、侮辱谩骂</span> 等会被屏蔽。</li>
        </ul>
      </div>

      <div class="card">
        <h2>发布帖子</h2>
        <form id="postForm">
          <select name="type" required>
            <option value="offer">提供化妆服务</option>
            <option value="looking">寻找化妆服务</option>
          </select>
          <input name="title" maxlength="100" placeholder="标题" required>
          <input name="city" maxlength="60" placeholder="城市" required>
          <input name="style" maxlength="60" placeholder="妆容类型，例如日常妆、婚礼妆">
          <input name="price" type="number" min="0" step="1" placeholder="价格（元，可填 0）">
          <input name="available_at" type="datetime-local" aria-label="可预约时间">
          <textarea name="description" maxlength="2000" required
            placeholder="请填写详细说明：方便对方联系你的称呼、联系方式（微信 / 电话 / 邮箱）、所在地址或区域、可提供服务或见面的时间等"></textarea>
          <p class="hint" id="postStatus" style="margin:0"></p>
          <button class="primary" type="submit">发布帖子</button>
        </form>
      </div>
    </aside>
  </div>
</main>

<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  // ---- 微信内置浏览器检测：提示复制链接到浏览器打开 ----
  const isWechat = /MicroMessenger/i.test(navigator.userAgent);
  const wechatGuide = document.getElementById("wechat-guide");
  const copyBtn = document.getElementById("wechatCopy");
  if (isWechat && wechatGuide) {
    wechatGuide.classList.add("show");
    document.body.style.overflow = "hidden"; // 遮罩期间锁定页面滚动
  }
  copyBtn?.addEventListener("click", async () => {
    const url = location.href;
    const done = () => {
      copyBtn.textContent = "已复制，请在浏览器粘贴打开";
      copyBtn.classList.add("primary");
    };
    try {
      await navigator.clipboard.writeText(url);
      done();
    } catch (err) {
      // 剪贴板被微信拦截时，退回兼容方案
      const ta = document.createElement("textarea");
      ta.value = url;
      ta.style.cssText = "position:fixed;opacity:0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); done(); } catch (e2) { /* 忽略 */ }
      ta.remove();
      if (!copyBtn.textContent.startsWith("已复制")) {
        copyBtn.textContent = "请长按地址复制，或在浏览器粘贴打开";
      }
    }
  });
  document.getElementById("wechatContinue")?.addEventListener("click", () => {
    wechatGuide.classList.remove("show");
    document.body.style.overflow = "";
  });

  // Supabase Project URL 和 anon/public key。
  const SUPABASE_URL = "https://ujusttdnqprpxmocdpys.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_zVOEvLiRF98FK7mv4XNJAw_NQnwgHsf";
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = (selector) => document.querySelector(selector);
  let currentUser = null;
  let nickname = "";
  let submitting = false;
  const PAGE_SIZE = 20;      // 每页 20 个帖子
  let page = 1;              // 当前页码
  let totalPosts = 0;        // 帖子总数（用于分页）

  // ---- 发布频率规则 ----
  const RATE = {
    user: 3,            // 登录用户每小时最多 3 个
    guest: 1,           // 游客每小时最多 1 个
    windowMs: 60 * 60 * 1000,
    storageKey: (who) => `post_rate_${who}`
  };
  // 游客访客标识：首次进入时生成并存 localStorage，用于数据库层限频 + 本地限频
  function getVisitorId() {
    let id = localStorage.getItem("visitor_id");
    if (!id) {
      id = (crypto.randomUUID && crypto.randomUUID()) ||
           "v" + Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
      localStorage.setItem("visitor_id", id);
    }
    return id;
  }
  function rateKey() {
    return currentUser ? RATE.storageKey(currentUser.id) : RATE.storageKey(`guest_${getVisitorId()}`);
  }
  function recentPostTimes() {
    try {
      const arr = JSON.parse(localStorage.getItem(rateKey()) || "[]");
      const now = Date.now();
      return arr.filter((t) => now - t < RATE.windowMs);
    } catch { return []; }
  }
  function postTimesLeft() {
    const quota = currentUser ? RATE.user : RATE.guest;
    return Math.max(0, quota - recentPostTimes().length);
  }
  function recordPost() {
    const times = recentPostTimes();
    times.push(Date.now());
    localStorage.setItem(rateKey(), JSON.stringify(times));
  }

  // ---- 敏感词屏蔽 ----
  // 命中即拦截发布。列表可按需在下方扩展。
  const SENSITIVE = {
    url: {
      label: "网址链接",
      test: (t) => /https?:\/\/|www\.|(^|[^a-z0-9])([a-z0-9-]{2,}\.)+(com|cn|net|org|xyz|top|io|info|vip|cc|me)([^a-z0-9]|$)/i.test(t)
    },
    erotic: {
      label: "色情低俗",
      words: ["色情","做爱","性交","性爱","嫖娼","卖淫","约炮","裸聊","裸照","黄色","黄片","毛片","打炮","一夜情","援交","自慰","口交","成人片","三级片","娇喘","骚","荡妇","妓女","援交"]
    },
    violent: {
      label: "暴力威胁",
      words: ["砍死","打死","弄死","杀你","杀了","杀人","打架","约架","群殴","捅死","恐吓","威胁","泼硫酸","提刀"]
    },
    insult: {
      label: "侮辱谩骂",
      words: ["傻逼","傻b","傻笔","智障","脑残","废物","垃圾","白痴","贱人","婊子","贱货","弱智","傻x","煞笔","去死","该死","畜生","混蛋","杂种","蠢货","草泥马","卧槽","妈的","滚蛋","狗日的","不要脸","泼妇","疯狗","野种","龟孙","王八","废物点心","恶心"]
    }
  };
  function checkSensitiveText(text) {
    const t = String(text || "");
    if (!t.trim()) return { ok: true };
    for (const [key, cfg] of Object.entries(SENSITIVE)) {
      if (cfg.words) {
        for (const w of cfg.words) {
          if (t.toLowerCase().includes(w.toLowerCase())) return { ok: false, label: cfg.label, word: w, key };
        }
      } else if (cfg.test && cfg.test(t)) {
        return { ok: false, label: cfg.label, word: "链接", key };
      }
    }
    return { ok: true };
  }

  // ---- 通用 ----
  function notify(text, isError = false) {
    const box = $("#message");
    box.textContent = text;
    box.classList.remove("hidden");
    box.classList.toggle("error", isError);
    window.clearTimeout(notify._t);
    notify._t = window.setTimeout(() => box.classList.add("hidden"), 5000);
  }
  function escapeHtml(value = "") {
    return String(value).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }
  function formatDate(value) {
    if (!value) return "时间待商议";
    return new Date(value).toLocaleString("zh-CN", {
      year: "numeric", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit"
    });
  }
  // 游客/用户统一默认头像（同一张示意图）
  const DEFAULT_AVATAR_SVG =
    '<svg viewBox="0 0 40 40" role="img" aria-label="默认头像"><circle cx="20" cy="20" r="20" fill="#e6f0ea"/><circle cx="20" cy="15" r="6" fill="#2f6b52"/><path d="M20 23c-6 0-9 4-9 9v2h18v-2c0-5-3-9-9-9z" fill="#2f6b52"/></svg>';
  function avatarHtml() { return DEFAULT_AVATAR_SVG; }

  function authorName(post) {
    // 优先用发布时快照的昵称；登录用户自己的帖子显示当前昵称
    if (post.author_name) return post.author_name;
    if (currentUser && post.user_id === currentUser.id) return nickname || "我";
    return "妆友";
  }
  function currentAvatarName() {
    return nickname || (currentUser && currentUser.email ? currentUser.email.split("@")[0] : "妆友");
  }
  async function setNicknameUI() {
    const meta = currentUser?.user_metadata || {};
    nickname = meta.nickname || localStorage.getItem("guest_nickname") || "";
    $("#headerName").textContent = nickname || "未设置昵称";
    $("#headerAvatar").innerHTML = avatarHtml();
  }

  // ---- 数据 ----
  async function syncUser() {
    const { data } = await supabase.auth.getUser();
    currentUser = data.user;
    $("#authControls").classList.toggle("hidden", !!currentUser);
    $("#userControls").classList.toggle("hidden", !currentUser);
    await setNicknameUI();
    const formBtn = $("#postForm").querySelector("button");
    formBtn.disabled = false; // 游客也可发帖（每小时 1 个）
    $("#postStatus").textContent = currentUser
      ? `你还可以发布 ${postTimesLeft()} 个帖子（登录用户每小时 3 个）`
      : `你还可以发布 ${postTimesLeft()} 个帖子（游客每小时 1 个）`;
    await loadPosts();
  }

  async function loadPosts() {
    const type = $("#typeFilter").value;
    const city = $("#cityFilter").value.trim();

    let query = supabase.from("posts")
      .select("id,user_id,visitor_id,author_name,type,title,city,style,price,available_at,description,created_at", { count: "exact" })
      .eq("status", "active")
      .order("created_at", { ascending: false })
      .range((page - 1) * PAGE_SIZE, page * PAGE_SIZE - 1)
      .limit(PAGE_SIZE);

    if (type) query = query.eq("type", type);
    if (city) query = query.ilike("city", `%${city}%`);

    const { data, error, count } = await query;
    if (error) {
      $("#posts").innerHTML = '<p class="empty">帖子加载失败，请检查 Supabase 配置和数据库策略。</p>';
      renderPagination();
      return;
    }

    totalPosts = count ?? (data ?? []).length;
    $("#postCount").textContent = totalPosts;
    if (!data?.length) {
      $("#posts").innerHTML = '<p class="empty">还没有符合条件的帖子。</p>';
      renderPagination();
      return;
    }

    $("#posts").innerHTML = data.map((post) => {
      const typeLabel = post.type === "offer" ? "提供化妆" : "寻找化妆";
      const price = post.price == null ? "价格面议" : `¥${post.price}`;
      return `
        <article class="post fade-in" data-post-id="${post.id}">
          <span class="avatar">${avatarHtml()}</span>
          <div class="post-body">
            <div class="author-line">
              <span class="author-name">${escapeHtml(authorName(post))}</span>
              <span class="tag">${typeLabel}</span>
              <span class="tag">${escapeHtml(post.city)}</span>
              ${post.style ? `<span class="tag">${escapeHtml(post.style)}</span>` : ""}
            </div>
            <h3>${escapeHtml(post.title)}</h3>
            <p>${escapeHtml(post.description)}</p>
            <p class="meta">${price} · 可服务：${formatDate(post.available_at)}</p>
          </div>
        </article>`;
    }).join("");
    renderPagination();
  }

  // 渲染分页控件（每页 PAGE_SIZE 条，超过则自动分页）
  function renderPagination() {
    const box = $("#pagination");
    const totalPages = Math.max(1, Math.ceil(totalPosts / PAGE_SIZE));
    if (totalPages <= 1) {
      box.innerHTML = "";
      box.classList.add("hidden");
      return;
    }
    box.classList.remove("hidden");
    box.innerHTML = `
      <button class="subtle" data-page="prev" ${page <= 1 ? "disabled" : ""}>上一页</button>
      <span class="hint">第 ${page} / ${totalPages} 页 · 共 ${totalPosts} 篇</span>
      <button class="subtle" data-page="next" ${page >= totalPages ? "disabled" : ""}>下一页</button>`;
  }
  $("#pagination").addEventListener("click", (event) => {
    const btn = event.target.closest("[data-page]");
    if (!btn || btn.disabled) return;
    const totalPages = Math.max(1, Math.ceil(totalPosts / PAGE_SIZE));
    if (btn.dataset.page === "prev" && page > 1) { page--; loadPosts(); }
    else if (btn.dataset.page === "next" && page < totalPages) { page++; loadPosts(); }
  });

  // ---- 昵称（游客存本地，登录用户存账号资料，云端持久化）----
  $("#editNickname").addEventListener("click", async () => {
    const name = (window.prompt("请输入你的昵称（用于展示，2-12 个字符）", nickname || "") || "").trim();
    if (!name) return;
    if (name.length < 2 || name.length > 12) return notify("昵称需为 2-12 个字符。", true);
    const sensitive = checkSensitiveText(name);
    if (!sensitive.ok) return notify(`昵称包含${sensitive.label}内容，请修改。`, true);
    if (currentUser) {
      const { error } = await supabase.auth.updateUser({ data: { nickname: name } });
      if (error) return notify(error.message, true);
    } else {
      localStorage.setItem("guest_nickname", name);
    }
    nickname = name;
    await setNicknameUI();
    notify("昵称已更新。");
  });

  // ---- 认证 ----
  $("#signUp").addEventListener("click", async () => {
    const email = $("#email").value.trim();
    const password = $("#password").value;
    if (!email || password.length < 6) return notify("请输入邮箱，密码至少 6 位。", true);
    const { error } = await supabase.auth.signUp({ email, password });
    if (error) return notify(error.message, true);
    notify("注册请求已提交。若项目启用了邮箱验证，请先查收验证邮件。");
    await syncUser();
  });

  $("#signIn").addEventListener("click", async () => {
    const { error } = await supabase.auth.signInWithPassword({
      email: $("#email").value.trim(),
      password: $("#password").value
    });
    if (error) return notify(error.message, true);
    await syncUser();
  });

  $("#signOut").addEventListener("click", async () => {
    const { error } = await supabase.auth.signOut();
    if (error) return notify(error.message, true);
    await syncUser();
  });

  // ---- 发帖（含频率限制 + 敏感词 + 防重复提交）----
  $("#postForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    if (submitting) return; // 防止重复提交
    if (postTimesLeft() <= 0) {
      const who = currentUser ? "登录用户" : "游客";
      const limit = currentUser ? RATE.user : RATE.guest;
      return notify(`已达发布上限：${who}每小时最多发布 ${limit} 个帖子，请稍后再试。`, true);
    }

    const form = event.currentTarget;
    const data = new FormData(form);
    const title = String(data.get("title")).trim();
    const description = String(data.get("description")).trim();

    // 敏感词检查
    const titleHit = checkSensitiveText(title);
    if (!titleHit.ok) return notify(`标题包含${titleHit.label}内容，请修改。`, true);
    const descHit = checkSensitiveText(description);
    if (!descHit.ok) return notify(`详细描述包含${descHit.label}内容，请修改。`, true);

    const priceValue = data.get("price");
    const availableValue = data.get("available_at");
    const payload = {
      user_id: currentUser?.id ?? null,
      visitor_id: currentUser ? null : getVisitorId(),
      author_name: nickname || null,   // 昵称快照，用于帖子列表展示
      type: data.get("type"),
      title,
      city: String(data.get("city")).trim(),
      style: String(data.get("style")).trim() || null,
      price: priceValue === "" ? null : Number(priceValue),
      available_at: availableValue ? new Date(availableValue).toISOString() : null,
      description
    };

    const btn = form.querySelector("button");
    submitting = true;
    btn.disabled = true;
    btn.textContent = "发布中…";

    const { error } = await supabase.from("posts").insert(payload);
    submitting = false;
    btn.disabled = false;
    btn.textContent = "发布帖子";

    if (error) return notify(error.message, true);

    recordPost();
    page = 1;               // 新帖发布后回到第一页，确保能看到新帖
    form.reset();
    notify("发布成功！帖子已出现在列表顶部。");
    await syncUser();          // 刷新帖子列表，让用户看到发布成功，同时更新剩余次数
    await loadPosts();
    const target = document.querySelector("[data-post-id]");
    if (target) target.scrollIntoView({ behavior: "smooth", block: "center" });
  });

  // ---- 筛选 ----
  function reloadFromFirstPage() { page = 1; loadPosts(); }
  $("#refresh").addEventListener("click", reloadFromFirstPage);
  $("#typeFilter").addEventListener("change", reloadFromFirstPage);
  $("#cityFilter").addEventListener("input", () => {
    window.clearTimeout(window.citySearchTimer);
    window.citySearchTimer = window.setTimeout(reloadFromFirstPage, 250);
  });
  supabase.auth.onAuthStateChange(() => syncUser());

  await syncUser();
</script>
</body>
</html>
